name: Warrant
description: >-
  Map which lines of a pull request the test suite actually stands behind, and
  post the reading list as a comment.
author: angelnicolasc

branding:
  icon: check-square
  color: orange

# The reason to run this here rather than on a laptop is that the cost leaves
# the human path entirely. A map costs one run of the suite per probe, and a
# runner has those seconds where a reviewer waiting on a terminal does not.
#
# Requires `permissions: pull-requests: write` to comment, and a checkout deep
# enough to contain the base commit — `actions/checkout@v4` with
# `fetch-depth: 0`. A probe rebuilds the pre-state, and a shallow tree has no
# pre-state to rebuild.

inputs:
  proof:
    description: >-
      The proof to map against. Defaults to whatever test command the
      repository already declares, which is detected the way a person would.
    required: false
    default: ""
  against:
    description: >-
      Git reference to compare against. Defaults to the base of the pull
      request.
    required: false
    default: ""
  strict:
    description: >-
      Fail the check on a finding: a load-bearing test edit, a vacuous proof,
      an unstable one, or a proof that does not hold at all.

      Off by default, and not out of timidity. A documentation-only pull
      request maps as vacuous — the suite passed before it and after it, so it
      proves nothing about the change — which is a true statement and a
      terrible reason to block a merge. Read the comments for a week, find out
      what your repository's numbers actually look like, then turn this on.
    required: false
    default: "false"
  min-coverage:
    description: >-
      Under strict, the percentage of changed lines that must be load-bearing.
      Unset by default. A low number is a fact about a change, and turning it
      into a gate on day one teaches people to pad diffs.
    required: false
    default: ""
  jobs:
    description: >-
      How many probes to run at once. Probes at the same level of the search
      are independent, so this trades compute for wall clock. `1` maps
      sequentially.
    required: false
    default: ""
  max-probes:
    description: Ceiling on probes, for very large diffs.
    required: false
    default: ""
  timeout:
    description: Per-command timeout inside a probe, in seconds.
    required: false
    default: ""
  comment:
    description: Post the map as a pull-request comment.
    required: false
    default: "true"
  version:
    description: >-
      Which release of Warrant to run, as a tag like `v0.1.0`.

      Left unset it is inferred, in this order: the tag this action was
      referenced at, if that is a full version; otherwise the version declared
      by the checkout of Warrant this action came from. Pinning the action
      pins the binary, so the two cannot drift.
    required: false
    default: ""
  from-source:
    description: >-
      Build Warrant from source instead of downloading the release.

      For runners no release targets. It is deliberately opt-in: a source
      build of a wasmtime-backed workspace is minutes where a download is
      seconds, and that is not a cost to pay by accident.
    required: false
    default: "false"
  receipt:
    description: Path to write the signed receipt to. Unset writes none.
    required: false
    default: ""

outputs:
  outcome:
    description: mapped, not_satisfied, vacuous, unstable_proof or no_changes.
    value: ${{ steps.map.outputs.outcome }}
  coverage:
    description: >-
      Percentage of changed lines that are load-bearing. Empty when the map is
      not a measurement — a vacuous proof did not prove none of the change,
      it could not be asked.
    value: ${{ steps.map.outputs.coverage }}
  changed-lines:
    description: Changed lines in the pull request, whatever the outcome.
    value: ${{ steps.map.outputs.changed-lines }}
  proven-lines:
    description: Changed lines the proof depends on.
    value: ${{ steps.map.outputs.proven-lines }}
  tampered:
    description: true when a load-bearing hunk sits on a verification surface.
    value: ${{ steps.map.outputs.tampered }}
  probes:
    description: Runs of the test command the map cost.
    value: ${{ steps.map.outputs.probes }}
  rounds:
    description: Sequential rounds those probes took — the wall clock, not the compute.
    value: ${{ steps.map.outputs.rounds }}
  markdown:
    description: Path to the rendered comment body.
    value: ${{ steps.map.outputs.markdown }}
  version:
    description: The release of Warrant that produced this map.
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    # Pinning the action pins the binary. The alternative — an action at one
    # version driving a tool at another — makes a map impossible to reproduce
    # from what the workflow file says.
    - name: Resolve the version of Warrant to run
      id: resolve
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        version="$REQUESTED"

        # A full version tag is a release. A moving tag like `v0` or a branch
        # is not, and falls through to the version the checkout declares.
        if [ -z "$version" ]; then
          case "$ACTION_REF" in
            v[0-9]*.[0-9]*.[0-9]*) version="$ACTION_REF" ;;
          esac
        fi

        if [ -z "$version" ]; then
          declared=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' "$ACTION_PATH/Cargo.toml" | head -1)
          if [ -n "$declared" ]; then version="v$declared"; fi
        fi

        if [ -z "$version" ]; then
          echo 'Could not work out which release of Warrant to run.' >&2
          echo 'Set the "version" input to a tag such as v0.1.0.' >&2
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Warrant $version"

    # One definition, read by both the restore and the save. A version tag is
    # immutable, so a hit stays correct forever and there is no staleness to
    # reason about.
    - name: Cache key
      id: key
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
        SOURCE: ${{ inputs.from-source }}
      run: |
        set -euo pipefail
        echo "key=warrant-$VERSION-${{ runner.os }}-${{ runner.arch }}-$SOURCE" >> "$GITHUB_OUTPUT"

    # Keyed on an immutable tag, so a hit stays correct forever and there is
    # no staleness to reason about.
    # Restore and save are split rather than using `actions/cache`, which
    # saves whatever is in the path at the end of the job. Here that would
    # store a binary this action never fetched — a workflow that installed its
    # own build of Warrant would publish it under a release's key.
    - name: Restore Warrant
      uses: actions/cache/restore@v4
      with:
        path: ~/.warrant-bin
        key: ${{ steps.key.outputs.key }}

    # Whether Warrant needs installing is a question about the filesystem, not
    # about the cache. Asking it this way also means a job that installed
    # Warrant itself is not made to fetch it again.
    - name: Is Warrant already here?
      id: have
      shell: bash
      run: |
        set -euo pipefail
        if [ -x "$HOME/.warrant-bin/bin/warrant" ] || [ -x "$HOME/.warrant-bin/bin/warrant.exe" ]; then
          echo "have=true" >> "$GITHUB_OUTPUT"
        else
          echo "have=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download Warrant
      if: steps.have.outputs.have != 'true' && inputs.from-source != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        set -euo pipefail

        # musl on x86-64 Linux rather than glibc: the binary then runs
        # unchanged inside whatever container a job happens to use, which a
        # glibc build linked against the runner image does not.
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)    target=x86_64-unknown-linux-musl;   archive=tar.xz ;;
          Linux-ARM64)  target=aarch64-unknown-linux-gnu;   archive=tar.xz ;;
          macOS-X64)    target=x86_64-apple-darwin;         archive=tar.xz ;;
          macOS-ARM64)  target=aarch64-apple-darwin;        archive=tar.xz ;;
          Windows-X64)  target=x86_64-pc-windows-msvc;      archive=zip    ;;
          *)
            echo "No Warrant release for ${{ runner.os }}-${{ runner.arch }}." >&2
            echo 'Set "from-source: true" to build it here instead.' >&2
            exit 1
            ;;
        esac

        asset="warrant-cli-$target.$archive"
        work="$RUNNER_TEMP/warrant-download"
        rm -rf "$work"; mkdir -p "$work"

        gh release download "$VERSION" --repo angelnicolasc/warrant \
          --pattern "$asset" --pattern "$asset.sha256" --dir "$work"

        # The download is the supply chain. Verifying it is not optional, and
        # the archive's own checksum travels beside it for exactly this.
        cd "$work"
        if command -v sha256sum >/dev/null 2>&1; then
          actual=$(sha256sum "$asset" | cut -d' ' -f1)
        else
          actual=$(shasum -a 256 "$asset" | cut -d' ' -f1)
        fi
        expected=$(cut -d' ' -f1 < "$asset.sha256" | tr -d '\r\n')
        if [ "$actual" != "$expected" ]; then
          echo "Checksum mismatch on $asset." >&2
          echo "  expected $expected" >&2
          echo "  actual   $actual" >&2
          exit 1
        fi

        mkdir -p unpacked
        if [ "$archive" = zip ]; then
          # Git Bash on a Windows runner has no `unzip`. PowerShell is the one
          # extractor guaranteed to be there.
          powershell -NoProfile -Command "Expand-Archive -Path '$asset' -DestinationPath unpacked -Force"
        else
          tar -xJf "$asset" -C unpacked
        fi

        # Found rather than assumed: whether the archive nests its contents in
        # a directory is the packager's business, not this script's.
        binary=$(find unpacked -type f \( -name warrant -o -name warrant.exe \) | head -1)
        test -n "$binary" || { echo "No warrant binary inside $asset." >&2; exit 1; }

        mkdir -p ~/.warrant-bin/bin
        cp "$binary" ~/.warrant-bin/bin/
        chmod +x ~/.warrant-bin/bin/* || true

    - name: Install Rust
      if: steps.have.outputs.have != 'true' && inputs.from-source == 'true'
      uses: dtolnay/rust-toolchain@stable

    - name: Build Warrant from source
      if: steps.have.outputs.have != 'true' && inputs.from-source == 'true'
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        set -euo pipefail
        src="$RUNNER_TEMP/warrant-src"
        rm -rf "$src"
        git clone --quiet --depth 1 --branch "$VERSION" \
          https://github.com/angelnicolasc/warrant "$src"
        cargo install --locked --path "$src/crates/warrant-cli" --root ~/.warrant-bin

    # Only what this action installed, and only when it installed something.
    - name: Save Warrant
      if: steps.have.outputs.have != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.warrant-bin
        key: ${{ steps.key.outputs.key }}

    - name: Put Warrant on the path
      shell: bash
      run: echo "$HOME/.warrant-bin/bin" >> "$GITHUB_PATH"

    # A separate step on purpose: `GITHUB_PATH` only takes effect for the ones
    # that follow, so this is the first point at which the thing the rest of
    # the action calls is the thing being checked.
    - name: Warrant runs
      shell: bash
      run: warrant --version

    - name: Resolve the base commit
      shell: bash
      run: |
        set -euo pipefail
        base='${{ inputs.against }}'
        if [ -z "$base" ]; then
          base='${{ github.event.pull_request.base.sha }}'
        fi
        if [ -z "$base" ]; then
          echo 'No base to compare against. Run this on a pull request, or set the "against" input.' >&2
          exit 1
        fi
        # A probe rebuilds the pre-state, so the base object has to be here.
        # Deepening is the fallback; checkout with fetch-depth 0 is the fix.
        if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          git fetch --no-tags --quiet origin "$base" || git fetch --no-tags --quiet --unshallow origin || true
        fi
        if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          echo "The base commit $base is not in this checkout." >&2
          echo 'Use actions/checkout@v4 with fetch-depth: 0.' >&2
          exit 1
        fi
        echo "WARRANT_BASE=$base" >> "$GITHUB_ENV"

    # One search. Every probe is a run of the repository's test command, so a
    # second rendering must never cost a second search: the terminal report,
    # the JSON and the comment body all come off the same map.
    #
    # The step outputs are written by the tool, not derived here. Shell
    # arithmetic over the JSON is how `coverage` came to read `0` for a
    # vacuous proof — a map that could not be measured, published as a map
    # that measured nothing.
    - name: Map
      id: map
      shell: bash
      run: |
        set -uo pipefail
        args=(map --against "$WARRANT_BASE" --ascii)
        args+=(--out-json warrant-map.json --out-markdown warrant-map.md)
        args+=(--github-output "$GITHUB_OUTPUT")
        if [ -n '${{ inputs.proof }}' ];      then args+=(--proof '${{ inputs.proof }}'); fi
        if [ -n '${{ inputs.jobs }}' ];       then args+=(--jobs '${{ inputs.jobs }}'); fi
        if [ -n '${{ inputs.max-probes }}' ]; then args+=(--max-probes '${{ inputs.max-probes }}'); fi
        if [ -n '${{ inputs.timeout }}' ];    then args+=(--timeout '${{ inputs.timeout }}'); fi
        if [ -n '${{ inputs.receipt }}' ];    then args+=(--receipt '${{ inputs.receipt }}'); fi
        if [ '${{ inputs.strict }}' = 'true' ]; then
          args+=(--strict)
          if [ -n '${{ inputs.min-coverage }}' ]; then
            args+=(--min-coverage '${{ inputs.min-coverage }}')
          fi
        fi

        # The gate's verdict is held until the comment is posted. A finding
        # nobody can see is worse than no finding, and a step that fails here
        # ends the job before the comment would be written.
        warrant "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY" || true

        # A finding is not a failure to run. The tool writes `gate` last, so
        # its absence means the map never got that far.
        if ! grep -q '^gate=' "$GITHUB_OUTPUT"; then
          echo 'The map did not run to completion; see the log above.' >&2
          exit 1
        fi

    # One comment, edited in place. A bot that appends a new one on every push
    # is a bot people mute, and a muted finding is no finding at all.
    - name: Comment
      if: ${{ inputs.comment == 'true' && github.event.pull_request.number }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        marker='<!-- warrant:necessity-map -->'
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)

        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@warrant-map.md
        else
          gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@warrant-map.md
        fi

    # Last, so a finding always reaches the pull request before the check goes
    # red. This re-raises the exit code the map already produced; it does not
    # re-decide anything, and it does not re-run the search.
    - name: Gate
      if: ${{ inputs.strict == 'true' }}
      shell: bash
      run: exit ${{ steps.map.outputs.gate }}
