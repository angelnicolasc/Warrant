name: token probe

# Temporary. Answers one question the logs cannot: what exactly the Actions
# token may do on this repository. Delete once the answer is recorded.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: What the token can reach
        run: |
          set -uo pipefail

          try() {
            printf '\n--- %s\n' "$1"; shift
            "$@" 2>&1 | head -4
            printf 'exit=%s\n' "${PIPESTATUS[0]}"
          }

          try 'GET releases (read)' \
            gh api "repos/$REPO/releases" --jq 'length'

          try 'POST release, draft, no target' \
            gh api --method POST "repos/$REPO/releases" \
              -f tag_name=probe-no-target -F draft=true

          try 'POST release, draft, with target_commitish' \
            gh api --method POST "repos/$REPO/releases" \
              -f tag_name=probe-with-target -f target_commitish="${{ github.sha }}" -F draft=true

          try 'POST a git ref (another contents:write operation)' \
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref=refs/heads/probe-branch -f sha="${{ github.sha }}"

          try 'DELETE that ref again' \
            gh api --method DELETE "repos/$REPO/git/refs/heads/probe-branch"

          echo
          echo '--- installation permissions as the API sees them'
          curl -sS -I -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/$REPO | grep -i 'x-accepted\|x-oauth\|^HTTP' || true
