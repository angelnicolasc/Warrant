name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Deliberately no global `RUSTFLAGS: -D warnings`. It applies to
  # dependencies too, so a warning introduced by a third-party crate on a new
  # toolchain would fail this repository's build. The clippy step below
  # enforces the same standard where it belongs — on this workspace.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The end-to-end tests use git as a stand-in agent and build fixture
      # repositories, so git needs an identity and must not rewrite line
      # endings underneath a tool that treats terminators as content.
      - name: Configure git for the fixtures
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version `rust-version` declares. The floor comes from
      # cranelift, which arrives through wasmtime, so it moves without this
      # workspace changing at all — which is exactly why it is checked rather
      # than stated.
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  action:
    name: the action itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A composite action's shell scripts are not compiled by anything, so a
      # missing `fi` ships and only fails in someone else's pull request.
      # `bash -n` parses each one without running it.
      - name: The action parses, and so does every script in it
        run: |
          python3 - <<'PY'
          import subprocess, sys, yaml
          action = yaml.safe_load(open("action.yml"))
          steps = action["runs"]["steps"]
          checked = 0
          for step in steps:
              script = step.get("run")
              if script is None:
                  continue
              assert step.get("shell") == "bash", f"{step.get('name')!r} has no shell"
              # GitHub substitutes ${{ }} before bash sees it; a placeholder
              # keeps the parse honest about the surrounding quoting.
              import re
              probe = re.sub(r"\$\{\{[^}]*\}\}", "placeholder", script)
              result = subprocess.run(["bash", "-n"], input=probe, text=True,
                                      capture_output=True)
              if result.returncode != 0:
                  sys.exit(f"{step.get('name')!r} does not parse:\n{result.stderr}")
              checked += 1
          assert checked >= 4, f"only {checked} scripts checked; the action lost steps"
          for name in ("outcome", "coverage", "tampered", "markdown"):
              assert name in action["outputs"], f"missing output {name}"
          print(f"action.yml parses; {checked} shell scripts parse")
          PY

  release-build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: The binary runs
        run: ./target/release/warrant --version
