[package]
name = "warrant-cli"
description = "The `warrant` command: run any agent inside a cell and get a proof map back."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "warrant"
path = "src/main.rs"

# Where `cargo binstall warrant-cli` should look, which is where `dist` puts
# things. Without this it guesses, and a guess that misses falls back to
# building from source — the slow path, silently, which is the one outcome
# binstall exists to avoid.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
pkg-fmt = "txz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
warrant-agent.workspace = true
warrant-attest.workspace = true
warrant-cell.workspace = true
warrant-core.workspace = true
warrant-diff.workspace = true
warrant-ledger.workspace = true
warrant-necessity.workspace = true
warrant-receipt.workspace = true

anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
